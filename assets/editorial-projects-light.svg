<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="995" viewBox="0 0 1200 995" role="img" aria-labelledby="title desc">
<title id="title">Selected Projects — Cinematic Systems Stories, light</title>
<desc id="desc">Transparent GitHub-themed editorial case studies. Mizan Finance simulates selecting an account, saving a financial entry and updating a report. Smart University Library simulates circulation of a book from shelf to student and back. Demonstration of features, not real screenshots, code or live user data; repositories are private.</desc>
<defs>
<linearGradient id="storyLine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087F99"/><stop offset=".55" stop-color="#7551B8"/><stop offset="1" stop-color="#147F65"/></linearGradient>
</defs>
<g font-family="Segoe UI,Arial,Helvetica,sans-serif">
