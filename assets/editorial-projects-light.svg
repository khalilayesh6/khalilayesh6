<text x="109" y="51" fill="#087F99" font-size="14" font-weight="700" letter-spacing="2">03 / SELECTED PROJECTS</text>
<text x="1147" y="52" fill="#69798B" text-anchor="end" font-family="Consolas,Liberation Mono,monospace" font-size="13.5">TWO SYSTEMS / PURPOSEFUL MOTION</text>
<text x="50" y="126" font-size="59" font-weight="740" fill="#1F2328" letter-spacing="-2">Work, in <tspan fill="#087F99">motion.</tspan></text>
<text x="52" y="161" font-size="19" fill="#4B5B6A">A closer look at what happens inside two practical software projects.</text>
