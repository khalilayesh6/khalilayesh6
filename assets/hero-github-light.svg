<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Khalil H Ayesh — Backend Developer</title>
  <desc id="desc">Light GitHub theme with transparent outer background. Animated dark navy developer workspace banner with cyan and violet lighting, and a code editor illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EFFB"/>
      <stop offset=".52" stop-color="#F1EFFB"/>
      <stop offset="1" stop-color="#F1EFFB"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238EAD"/>
      <stop offset=".54" stop-color="#8976CF"/>
      <stop offset="1" stop-color="#8976CF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238EAD" stop-opacity="0"/>
      <stop offset=".5" stop-color="#238EAD" stop-opacity=".5"/>
      <stop offset="1" stop-color="#238EAD" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blue">
      <stop offset="0" stop-color="#238EAD" stop-opacity=".5"/>
      <stop offset="1" stop-color="#238EAD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple">
      <stop offset="0" stop-color="#8976CF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8976CF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#897BC8" stroke-width=".55" opacity=".09"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1200" height="370" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    
    
    <circle cx="720" cy="140" r="340" fill="url(#blue)">
      <animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="295" r="250" fill="url(#purple)">
      <animate attributeName="opacity" values=".9;.45;.9" dur="9s" repeatCount="indefinite"/>
    </circle>
    <path d="M-70 315C200 243 319 447 638 336S1020 340 1290 165" fill="none" stroke="#4D99B5" stroke-width="1.2" opacity=".16"/>
    <path d="M-70 330C200 258 319 462 638 351S1020 355 1290 180" fill="none" stroke="#897BC8" stroke-width="1" opacity=".12"/>
    <path d="M0 3H1200" stroke="url(#edge)" stroke-width="5"/>
    <path d="M0 365H1200" stroke="url(#edge)" stroke-width="2" opacity=".65"/>
    <rect x="-430" y="3" width="430" height="3" fill="url(#shine)">
      <animate attributeName="x" values="-430;1200" dur="9s" repeatCount="indefinite"/>
    </rect>
    <path d="M58 48V322" stroke="#4D99B5" stroke-width="3" opacity=".9"/>
    <rect x="78" y="48" width="220" height="30" rx="15" fill="#F1EFFB" stroke="#CBD8E4" stroke-width="1"/>
    <circle cx="97" cy="63" r="4.7" fill="#45DFBF">
      <animate attributeName="opacity" values="1;.32;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="113" y="68" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#24364B" letter-spacing="1.5">HELLO, I'M</text>
    <text x="77" y="162" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="800" fill="#24364B" letter-spacing="-1.6">Khalil Ayesh</text>
    <text x="79" y="207" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#176F93" letter-spacing="3">BACKEND DEVELOPER</text>
    <rect x="79" y="225" width="58" height="3" rx="1.5" fill="#65DFFF"/>
    <rect x="144" y="225" width="25" height="3" rx="1.5" fill="#9B8FFF"/>
    <text x="79" y="265" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364B">Building practical projects.</text>
    <text x="79" y="293" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#24364B">Learning something new every day.</text>
    <text x="79" y="335" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#4D657C">BUILD  /  LEARN  /  IMPROVE</text>
    <g>
      <rect x="720" y="49" width="422" height="273" rx="17" fill="#F1EFFB" stroke="#CBD8E4" stroke-width="1.3"/>
      <rect x="720" y="49" width="422" height="42" rx="17" fill="#F1EFFB"/>
      <path d="M720 78V91H1142V78" fill="#F1EFFB"/>
      <line x1="720" y1="91" x2="1142" y2="91" stroke="#CBD8E4" stroke-width="1"/>
      <circle cx="749" cy="70" r="5.3" fill="#FF777C"/>
      <circle cx="768" cy="70" r="5.3" fill="#FFCC70"/>
      <circle cx="787" cy="70" r="5.3" fill="#47D3AA"/>
      <text x="930" y="76" text-anchor="middle" font-family="monospace" font-size="13" fill="#4D657C">developer.ts</text>
      <text x="743" y="132" font-family="monospace" font-size="15" fill="#4D657C">01</text>
      <text x="777" y="132" font-family="monospace" font-size="16" fill="#6854A7">const</text>
      <text x="834" y="132" font-family="monospace" font-size="16" fill="#24364B">developer = {</text>
      <text x="743" y="169" font-family="monospace" font-size="15" fill="#4D657C">02</text>
      <text x="804" y="169" font-family="monospace" font-size="16" fill="#176F93">focus:</text>
      <text x="870" y="169" font-family="monospace" font-size="16" fill="#24364B">"backend",</text>
      <text x="743" y="206" font-family="monospace" font-size="15" fill="#4D657C">03</text>
      <text x="804" y="206" font-family="monospace" font-size="16" fill="#176F93">mode:</text>
      <text x="862" y="206" font-family="monospace" font-size="16" fill="#24364B">"learning",</text>
      <text x="743" y="243" font-family="monospace" font-size="15" fill="#4D657C">04</text>
      <text x="804" y="243" font-family="monospace" font-size="16" fill="#176F93">goal:</text>
      <text x="862" y="243" font-family="monospace" font-size="16" fill="#24364B">"build better"</text>
      <text x="743" y="280" font-family="monospace" font-size="15" fill="#4D657C">05</text>
      <text x="777" y="280" font-family="monospace" font-size="16" fill="#24364B">};</text>
      <rect x="811" y="266" width="9" height="20" rx="1.5" fill="#5CE0FA">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="720" y="308" width="422" height="14" rx="7" fill="#F1EFFB"/>
      <circle cx="1097" cy="315" r="3.3" fill="#43D3AA">
        <animate attributeName="opacity" values=".3;1;.3" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <path d="M1135 360H1056" stroke="#897BC8" stroke-width="2" opacity=".5"/>
  </g>
  
</svg>
