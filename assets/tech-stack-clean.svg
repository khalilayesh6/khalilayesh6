<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title desc">
<title id="title">Technologies and tools — a simple developer toolkit</title>
<desc id="desc">Learning and building with PHP, Laravel, Java, MySQL, Git and GitHub, grouped by backend development, database and workflow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#091322"/>
    <stop offset=".55" stop-color="#0c1730"/>
    <stop offset="1" stop-color="#17133b"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5cdef5"/>
    <stop offset=".52" stop-color="#4a8add"/>
    <stop offset="1" stop-color="#aa92fa"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="282" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="282" fill="url(#bg)"/>
  <path d="M0 2H1200" stroke="url(#line)" stroke-width="3"/>
  <path d="M0 279H1200" stroke="url(#line)" stroke-width="2" opacity=".5"/>
  
  <!-- Clear heading without an extra subtitle block -->
  <circle cx="47" cy="47" r="4.4" fill="#5dd8bd">
    <animate attributeName="opacity" values=".55;1;.55" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <text x="65" y="52" font-size="13" font-weight="700" letter-spacing="2" fill="#92cde0">TECH STACK</text>
  <text x="45" y="97" font-size="34" font-weight="800" letter-spacing="-.5" fill="#f3f7ff">Tools &amp; technologies</text>
  <text x="1153" y="96" text-anchor="end" font-size="14" font-weight="500" letter-spacing=".6" fill="#8fa9c6">Learning &amp; building with</text>

  <path d="M45 122H1155" fill="none" stroke="#334c66" stroke-width="1"/>
  <path d="M529 143V245M823 143V245" fill="none" stroke="#38516e" stroke-width="1" opacity=".65"/>

  <!-- Three calm groups: the tool names, not decorative text, do the work -->
  <text x="45" y="157" font-size="16" letter-spacing="1.5" font-weight="700" fill="#65d8ec">BACKEND &amp; LANGUAGES</text>
  <text x="561" y="157" font-size="16" letter-spacing="1.5" font-weight="700" fill="#ac9cfa">DATABASE</text>
  <text x="858" y="157" font-size="16" letter-spacing="1.5" font-weight="700" fill="#65d8ec">WORKFLOW</text>

  <!-- Technologies: single consistent style, no repeated labels or extra descriptions -->
  <rect x="45" y="181" width="109" height="59" rx="12" fill="#14293f" stroke="#3d5f7d"/>
  <rect x="167" y="181" width="163" height="59" rx="12" fill="#14293f" stroke="#3d5f7d"/>
  <rect x="343" y="181" width="122" height="59" rx="12" fill="#14293f" stroke="#3d5f7d"/>
  <text x="99.5" y="219.5" font-size="25" font-weight="750" fill="#f2f7ff" text-anchor="middle">PHP</text>
  <text x="248.5" y="219.5" font-size="25" font-weight="750" fill="#f2f7ff" text-anchor="middle">Laravel</text>
  <text x="404" y="219.5" font-size="25" font-weight="750" fill="#f2f7ff" text-anchor="middle">Java</text>

  <rect x="561" y="181" width="197" height="59" rx="12" fill="#1b2542" stroke="#5c548a"/>
  <text x="659.5" y="219.5" font-size="26" font-weight="750" fill="#f2f7ff" text-anchor="middle">MySQL</text>

  <rect x="858" y="181" width="100" height="59" rx="12" fill="#14293f" stroke="#3d5f7d"/>
  <rect x="971" y="181" width="183" height="59" rx="12" fill="#14293f" stroke="#3d5f7d"/>
  <text x="908" y="219.5" font-size="25" font-weight="750" fill="#f2f7ff" text-anchor="middle">Git</text>
  <text x="1062.5" y="219.5" font-size="25" font-weight="750" fill="#f2f7ff" text-anchor="middle">GitHub</text>

  <rect x=".5" y=".5" width="1199" height="281" rx="19.5" fill="none" stroke="#405879" opacity=".7"/>
</g>
</svg>