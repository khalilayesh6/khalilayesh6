<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="groupTitle groupDesc">
<title id="groupTitle">Selected Projects — Mizan Finance and Smart University Library</title>
<desc id="groupDesc">A unified portfolio showcase containing two independent case-study cards. The first presents Mizan Finance with accounts, transactions and reporting. The second presents Smart University Library with Java, JavaFX and Maven, covering catalog records, borrowing, returns and fines. Both repositories remain private. Small moving lights trace each project workflow.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#081323"/>
    <stop offset=".53" stop-color="#0C1930"/>
    <stop offset="1" stop-color="#171431"/>
  </linearGradient>
  <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5ADCEB"/><stop offset=".54" stop-color="#4B8CD9"/><stop offset="1" stop-color="#AB96F5"/>
  </linearGradient>
  <linearGradient id="inner" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#12223B"/><stop offset=".55" stop-color="#112038"/><stop offset="1" stop-color="#181C37"/>
  </linearGradient>
  <linearGradient id="inner2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#171E39"/><stop offset=".56" stop-color="#141E38"/><stop offset="1" stop-color="#1A1938"/>
  </linearGradient>
  <radialGradient id="halo1"><stop offset="0" stop-color="#2184C6" stop-opacity=".19"/><stop offset="1" stop-color="#2184C6" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo2"><stop offset="0" stop-color="#715BB9" stop-opacity=".18"/><stop offset="1" stop-color="#715BB9" stop-opacity="0"/></radialGradient>
  <pattern id="mesh" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#7E9EC7" stroke-width=".6" opacity=".075"/>
  </pattern>
  <clipPath id="outlineClip"><rect width="1200" height="760" rx="23"/></clipPath>
</defs>
