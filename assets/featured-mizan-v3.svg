<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="345" viewBox="0 0 1200 345" role="img" aria-labelledby="title desc">
<title id="title">Selected Work — Mizan Finance Management System</title>
<desc id="desc">Mizan Finance case study. Goal: keep financial activity organized. Main areas: accounts, transactions, and reporting, visually connected in a simple animated workflow. Source code remains private.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#091322"/><stop offset=".53" stop-color="#0c1830"/><stop offset="1" stop-color="#171437"/>
 </linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#62deec"/><stop offset=".5" stop-color="#4b89d9"/><stop offset="1" stop-color="#ad96f9"/>
 </linearGradient>
 <radialGradient id="glow">
  <stop offset="0" stop-color="#2c7cbd" stop-opacity=".22"/><stop offset="1" stop-color="#2c7cbd" stop-opacity="0"/>
 </radialGradient>
 <clipPath id="frame"><rect width="1200" height="345" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)" font-family="Arial,Helvetica,sans-serif">
 <rect width="1200" height="345" fill="url(#bg)"/>
 <circle cx="902" cy="186" r="330" fill="url(#glow)"/>
 <path d="M0 2H1200" stroke="url(#accent)" stroke-width="3"/>
 <path d="M0 342H1200" stroke="url(#accent)" stroke-width="2" opacity=".5"/>
 <circle cx="49" cy="38" r="4.5" fill="#6ee1c1"/>
 <text x="65" y="43" fill="#a7cddd" font-size="13" letter-spacing="1.8" font-weight="700">SELECTED WORK</text>
 <text x="1149" y="43" fill="#8da8c6" font-size="13" font-family="monospace" letter-spacing="1.1" text-anchor="end">01 / PROJECT CASE STUDY</text>
 <path d="M45 64H1155" stroke="#37506f" stroke-width="1.1"/>
 <path d="M652 87V313" stroke="#344b6a" stroke-width="1.1"/>

 <!-- The project, not an invented dashboard screenshot, is the main subject. -->
 <rect x="44" y="85" width="115" height="28" rx="14" fill="#133149" stroke="#366480"/>
 <text x="101.5" y="104" font-family="monospace" font-size="12.3" letter-spacing=".5" text-anchor="middle" fill="#aee2ec">FEATURED 01</text>
 <text x="42" y="166" font-size="43" font-weight="800" letter-spacing="-.7" fill="#f3f7ff">Mizan Finance</text>
 <text x="42" y="213" font-size="43" font-weight="800" letter-spacing="-.7" fill="#f3f7ff">Management System</text>
 <path d="M44 233H115" stroke="#64ddec" stroke-width="3" stroke-linecap="round"/>
 <path d="M125 233H154" stroke="#ab97fa" stroke-width="3" stroke-linecap="round"/>
 <text x="44" y="266" font-size="17" font-weight="700" letter-spacing="1.5" fill="#81b9d2">PROJECT GOAL</text>
 <text x="44" y="297" font-size="19" fill="#c0d2e6">Keep accounts and financial activity</text>
 <text x="44" y="322" font-size="19" fill="#c0d2e6">organized and easier to review.</text>

 <!-- A system summary that's reusable across future project cards. -->
 <text x="691" y="89" font-size="13.2" font-weight="700" letter-spacing="1.5" fill="#94b6d3">WHAT IT COVERS</text>
 <path d="M716 128V293" stroke="#416181" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path d="M716 128V293" stroke="url(#accent)" stroke-width="2.6" fill="none" stroke-dasharray="5 20" stroke-linecap="round" opacity=".8">
  <animate attributeName="stroke-dashoffset" values="0;-100" dur="7s" repeatCount="indefinite"/>
 </path>
 <circle r="5.5" fill="#a1e6ef" stroke="#d3faff" stroke-width=".9">
  <animateMotion path="M716 128V293" dur="5.5s" repeatCount="indefinite"/>
 </circle>

 <circle cx="716" cy="129" r="5.4" fill="#64dce9"/>
 <rect x="743" y="103" width="411" height="60" rx="13" fill="#12263e" stroke="#39637e"/>
 <path d="M760 104H1137" stroke="#5cdaec" stroke-width="2" stroke-linecap="round"/>
 <text x="764" y="126" font-family="monospace" font-size="12" fill="#7dc5dd" letter-spacing="1.2">01 / ORGANIZE</text>
 <text x="764" y="150" font-size="21" font-weight="750" fill="#f1f7ff">Accounts</text>
 <text x="1131" y="148" font-size="14.5" text-anchor="end" fill="#9bb5cd">Balances &amp; structure</text>

 <circle cx="716" cy="211" r="5.4" fill="#8cb6f4"/>
 <rect x="743" y="185" width="411" height="60" rx="13" fill="#14273f" stroke="#465f84"/>
 <path d="M760 186H1137" stroke="#72a8ed" stroke-width="2" stroke-linecap="round"/>
 <text x="764" y="208" font-family="monospace" font-size="12" fill="#8fb6ea" letter-spacing="1.2">02 / RECORD</text>
 <text x="764" y="232" font-size="21" font-weight="750" fill="#f1f7ff">Transactions</text>
 <text x="1131" y="230" font-size="14.5" text-anchor="end" fill="#9bb5cd">Income &amp; expenses</text>

 <circle cx="716" cy="293" r="5.4" fill="#b5a1f7"/>
 <rect x="743" y="267" width="411" height="60" rx="13" fill="#1b233f" stroke="#5e5989"/>
 <path d="M760 268H1137" stroke="#ae9afb" stroke-width="2" stroke-linecap="round"/>
 <text x="764" y="290" font-family="monospace" font-size="12" fill="#b4a7ee" letter-spacing="1.2">03 / UNDERSTAND</text>
 <text x="764" y="314" font-size="21" font-weight="750" fill="#f1f7ff">Reporting</text>
 <text x="1131" y="312" font-size="14.5" text-anchor="end" fill="#b8bbdc">Clear summaries</text>

 <rect x=".5" y=".5" width="1199" height="344" rx="19.5" fill="none" stroke="#45607e" opacity=".69"/>
</g>
