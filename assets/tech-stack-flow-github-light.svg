<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="366" viewBox="0 0 1200 366" role="img" aria-labelledby="title desc">
<title id="title">My developer toolkit — application, data and workflow</title>
<desc id="desc">Light GitHub theme with transparent outer background. An animated visual shows PHP and Laravel used for application logic exchanging data with MySQL, and changes flowing from Git to GitHub. Java is shown separately as another language being learned.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F1EFFB"/>
    <stop offset=".52" stop-color="#F1EFFB"/>
    <stop offset="1" stop-color="#F1EFFB"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#238EAD"/>
    <stop offset=".54" stop-color="#238EAD"/>
    <stop offset="1" stop-color="#8976CF"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#238EAD" stop-opacity=".2"/>
    <stop offset="1" stop-color="#238EAD" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clip"><rect width="1200" height="366" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)" font-family="Arial,Helvetica,sans-serif">
  
  <circle cx="858" cy="153" r="332" fill="url(#halo)"/>
  
  
  <path d="M365 30V332" fill="none" stroke="#CBD8E4" stroke-width="1.3"/>

  <!-- Quiet editorial introduction -->
  <circle cx="47" cy="45" r="4.3" fill="#5BE2B9">
    <animate attributeName="opacity" values=".5;1;.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="63" y="50" font-size="13" font-weight="700" fill="#24364B" letter-spacing="2">DEVELOPER TOOLKIT</text>
  <text x="39" y="131" font-size="37" font-weight="800" fill="#24364B" letter-spacing="-.6">Tools that</text>
  <text x="39" y="176" font-size="37" font-weight="800" fill="#24364B" letter-spacing="-.6">work together.</text>
  <path d="M39 199H119" stroke="#4D99B5" stroke-width="3" stroke-linecap="round"/>
  <path d="M126 199H158" stroke="#897BC8" stroke-width="3" stroke-linecap="round"/>
  <text x="39" y="246" font-size="17" fill="#4D657C">Application. Data.</text>
  <text x="39" y="274" font-size="17" fill="#4D657C">Version control.</text>
  <text x="39" y="328" font-size="13" fill="#6854A7" font-weight="650" letter-spacing="1.7">LEARNING &amp; BUILDING</text>

  <!-- APPLICATION / DATA ROW -->
  <text x="402" y="55" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#1A786C">01 / APPLICATION &amp; DATA</text>
  <text x="1159" y="55" font-size="12.5" font-family="monospace" text-anchor="end" letter-spacing="1.2" fill="#4D657C">REQUEST / RESPONSE</text>

  <rect x="402" y="79" width="405" height="127" rx="15" fill="#F1EFFB" stroke="#897BC8" stroke-width="1.35"/>
  <path d="M419 80H790" stroke="#4D99B5" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="424" y="104" width="54" height="54" rx="12" fill="#F1EFFB" stroke="#897BC8"/>
  <path d="M443 119L435 131L443 143M459 119L467 131L459 143M455 114L448 148" fill="none" stroke="#4D99B5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="494" y="133" font-size="29" font-weight="800" fill="#24364B" letter-spacing="-.4">PHP + Laravel</text>
  <text x="494" y="164" font-size="16.5" fill="#24364B">Backend language &amp; framework</text>
  <text x="424" y="189" font-size="13" font-family="monospace" fill="#6854A7" letter-spacing=".75">APPLICATION LOGIC</text>

  <rect x="936" y="79" width="223" height="127" rx="15" fill="#F1EFFB" stroke="#897BC8" stroke-width="1.35"/>
  <path d="M952 80H1142" stroke="#897BC8" stroke-width="2.8" stroke-linecap="round"/>
  <ellipse cx="971" cy="120" rx="16" ry="6" fill="none" stroke="#897BC8" stroke-width="2.3"/>
  <path d="M955 120V147C955 155 987 155 987 147V120M955 133C955 141 987 141 987 133" fill="none" stroke="#897BC8" stroke-width="2.3"/>
  <text x="1002" y="134" font-size="27" font-weight="800" fill="#24364B">MySQL</text>
  <text x="956" y="177" font-size="16" fill="#24364B">Data &amp; queries</text>
  <text x="956" y="194" font-size="12.5" font-family="monospace" fill="#6854A7" letter-spacing=".8">DATABASE</text>

  <!-- Two meaning-bearing animated data tracks -->
  <path d="M819 117H923" fill="none" stroke="#897BC8" stroke-width="2" stroke-linecap="round"/>
  <path d="M819 162H923" fill="none" stroke="#897BC8" stroke-width="2" stroke-linecap="round"/>
  <path d="M918 112L925 117L918 122" fill="none" stroke="#4D99B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M824 157L817 162L824 167" fill="none" stroke="#897BC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="4.6" fill="#6DE4F2">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M824 117H918"/>
  </circle>
  <circle r="4.6" fill="#B6A3FF">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M918 162H824"/>
  </circle>
  
  <!-- The separate Java language and a meaningful Git to GitHub progression -->
  <text x="402" y="240" font-size="13.5" font-weight="700" letter-spacing="1.7" fill="#6854A7">02 / ALSO LEARNING</text>
  <text x="659" y="240" font-size="13.5" font-weight="700" letter-spacing="1.7" fill="#1A786C">03 / VERSION CONTROL</text>
  
  <rect x="402" y="261" width="204" height="69" rx="13" fill="#F1EFFB" stroke="#CBD8E4" stroke-width="1.2"/>
  <rect x="416" y="277" width="35" height="36" rx="9" fill="#F1EFFB" stroke="#896C63"/>
  <text x="433.5" y="301" text-anchor="middle" font-size="18" font-weight="800" fill="#9C6F2C">J</text>
  <text x="465" y="304" font-size="25" font-weight="750" fill="#24364B">Java</text>

  <rect x="659" y="261" width="177" height="69" rx="13" fill="#F1EFFB" stroke="#897BC8" stroke-width="1.2"/>
  <rect x="674" y="277" width="35" height="36" rx="9" fill="#F1EFFB" stroke="#8B635A"/>
  <path d="M692 284V305M692 287L700 295M692 305L700 295" fill="none" stroke="#F4A183" stroke-width="2.1" stroke-linecap="round"/>
  <text x="723" y="304" font-size="25" font-weight="750" fill="#24364B">Git</text>

  <rect x="941" y="261" width="218" height="69" rx="13" fill="#F1EFFB" stroke="#897BC8" stroke-width="1.2"/>
  <rect x="955" y="277" width="35" height="36" rx="9" fill="#F1EFFB" stroke="#897BC8"/>
  <circle cx="973" cy="295" r="11" fill="none" stroke="#897BC8" stroke-width="2"/>
  <path d="M966 303L966 294M980 303L980 294M965 288L970 285M981 288L976 285" fill="none" stroke="#897BC8" stroke-width="1.7" stroke-linecap="round"/>
  <text x="1004" y="304" font-size="25" font-weight="750" fill="#24364B">GitHub</text>

  <text x="889" y="254" text-anchor="middle" font-family="monospace" font-size="12" fill="#6854A7" letter-spacing="1.2">PUSH</text>
  <path d="M845 294H931" fill="none" stroke="#897BC8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M926 289L934 294L926 299" fill="none" stroke="#4D99B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="4.3" fill="#79E5D9">
    <animateMotion dur="3s" repeatCount="indefinite" path="M850 294H924"/>
  </circle>

  
</g>
</svg>