      <text x="743" y="280" font-family="Consolas,Liberation Mono,monospace" font-size="15" fill="#A7B2BE">05</text>
      <text x="777" y="280" font-family="Consolas,Liberation Mono,monospace" font-size="16" fill="#C9D1D9">};</text>
      <rect x="811" y="266" width="9" height="20" rx="1.5" fill="#5ce0fa">
