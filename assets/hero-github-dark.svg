    <text x="113" y="68" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="12" fill="#72D8EC" letter-spacing="1.08">HELLO, I'M</text>
    <text x="77" y="162" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="64" font-weight="700" fill="#F0F6FC" letter-spacing="-0.8">Khalil Ayesh</text>
    <text x="79" y="207" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#72D8EC" letter-spacing="1.2">BACKEND DEVELOPER</text>
    <rect x="79" y="225" width="58" height="3" rx="1.5" fill="#65dfff"/>
    <rect x="144" y="225" width="25" height="3" rx="1.5" fill="#9b8fff"/>
    <text x="79" y="265" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" fill="#C9D1D9">Building practical projects.</text>
    <text x="79" y="293" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" fill="#C9D1D9">Learning something new every day.</text>
    <text x="79" y="335" font-family="Consolas,Liberation Mono,monospace" font-size="12" letter-spacing="1.08" fill="#A7B2BE">BUILD  /  LEARN  /  IMPROVE</text>
