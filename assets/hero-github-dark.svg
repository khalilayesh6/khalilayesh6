<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Khalil H Ayesh — Backend Developer</title>
  <desc id="desc">Typography V4: Segoe UI editorial hierarchy and restrained Github-aligned color system. GitHub-native flat canvas: no image-wide background, no atmospheric overlays, dark contrast. Ambient-edge integrated GitHub design, coherent cyan-violet identity. Dark GitHub theme with transparent outer background. Animated dark navy developer workspace banner with cyan and violet lighting, and a code editor illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091322"/>
      <stop offset=".52" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#17133b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cdef5"/>
      <stop offset=".54" stop-color="#3472d5"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d5ea" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38d5ea" stop-opacity=".5"/>
      <stop offset="1" stop-color="#38d5ea" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blue">
      <stop offset="0" stop-color="#258de2" stop-opacity=".5"/>
      <stop offset="1" stop-color="#258de2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple">
      <stop offset="0" stop-color="#9c78ed" stop-opacity=".3"/>
      <stop offset="1" stop-color="#9c78ed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#acc8ff" stroke-width=".55" opacity=".09"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1200" height="370" rx="24"/>
    </clipPath>
  </defs>
