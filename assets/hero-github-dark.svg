      <text x="870" y="169" font-family="Consolas,Liberation Mono,monospace" font-size="16" fill="#63D6B0">"backend",</text>
      <text x="743" y="206" font-family="Consolas,Liberation Mono,monospace" font-size="15" fill="#A7B2BE">03</text>
      <text x="804" y="206" font-family="Consolas,Liberation Mono,monospace" font-size="16" fill="#72D8EC">mode:</text>
      <text x="862" y="206" font-family="Consolas,Liberation Mono,monospace" font-size="16" fill="#63D6B0">"learning",</text>
      <text x="743" y="243" font-family="Consolas,Liberation Mono,monospace" font-size="15" fill="#A7B2BE">04</text>
