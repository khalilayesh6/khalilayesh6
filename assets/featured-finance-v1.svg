<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-labelledby="title desc">
<title id="title">Featured Project — Finance Management System</title>
<desc id="desc">A high-level case study of a finance management project focused on accounts, transactions and reporting. Private source code is not linked. The illustrated dashboard is conceptual.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#091322"/>
  <stop offset=".55" stop-color="#0c1830"/>
  <stop offset="1" stop-color="#181538"/>
 </linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#60def1"/>
  <stop offset=".54" stop-color="#4f8cdd"/>
  <stop offset="1" stop-color="#ad95fa"/>
 </linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#10223b"/>
  <stop offset="1" stop-color="#171e39"/>
 </linearGradient>
 <radialGradient id="glow">
  <stop offset="0" stop-color="#278cce" stop-opacity=".2"/>
  <stop offset="1" stop-color="#278cce" stop-opacity="0"/>
 </radialGradient>
 <clipPath id="clip"><rect width="1200" height="356" rx="21"/></clipPath>
 <clipPath id="dashclip"><rect x="658" y="75" width="493" height="236" rx="17"/></clipPath>
</defs>
<g clip-path="url(#clip)" font-family="Arial,Helvetica,sans-serif">
 <rect width="1200" height="356" fill="url(#bg)"/>
 <circle cx="936" cy="185" r="355" fill="url(#glow)"/>
 <path d="M0 2H1200" stroke="url(#edge)" stroke-width="3"/>
 <path d="M0 353H1200" stroke="url(#edge)" stroke-width="2" opacity=".55"/>

 <!-- Editorial side, with plenty of breathing room -->
 <rect x="46" y="27" width="188" height="30" rx="15" fill="#102d43" stroke="#2e5b76"/>
 <circle cx="64" cy="42" r="4.3" fill="#60ddbe"/>
 <text x="79" y="47" font-size="12.8" letter-spacing="1.5" font-weight="700" fill="#b7e0ec">FEATURED PROJECT</text>
 <text x="47" y="110" font-family="monospace" font-size="14" letter-spacing="1.2" fill="#80a8c9">01 / CASE STUDY</text>
 <text x="46" y="165" font-size="43" letter-spacing="-.8" font-weight="800" fill="#f2f7ff">Finance Management</text>
 <text x="46" y="211" font-size="43" letter-spacing="-.8" font-weight="800" fill="#f2f7ff">System</text>
 <path d="M48 232H111" stroke="#60dce9" stroke-width="3" stroke-linecap="round"/>
 <path d="M121 232H151" stroke="#ab95fa" stroke-width="3" stroke-linecap="round"/>
 <text x="47" y="268" font-size="18" fill="#b0c5db">Organizing accounts, recording transactions,</text>
 <text x="47" y="295" font-size="18" fill="#b0c5db">and making financial reporting clearer.</text>
 <text x="47" y="330" font-family="monospace" font-size="13" letter-spacing=".9" fill="#86a5bf">SOURCE PRIVATE  ·  PROJECT OVERVIEW</text>
 <path d="M623 36V320" stroke="#2c4564" stroke-width="1.2"/>

 <!-- Product-system illustration; not a fabricated product screenshot -->
 <rect x="658" y="75" width="493" height="236" rx="17" fill="url(#panel)" stroke="#465b80" stroke-width="1.5"/>
 <g clip-path="url(#dashclip)">
  <rect x="658" y="75" width="493" height="41" fill="#182842"/>
  <path d="M658 116H1151" stroke="#324766" stroke-width="1"/>
  <circle cx="679" cy="95.5" r="4.7" fill="#f27b82"/>
  <circle cx="697" cy="95.5" r="4.7" fill="#f3c577"/>
  <circle cx="715" cy="95.5" r="4.7" fill="#63d9b5"/>
  <text x="739" y="101" font-family="monospace" font-size="12.5" letter-spacing=".5" fill="#b7cbdf">financial-workspace</text>
  <rect x="1027" y="89" width="102" height="18" rx="9" fill="#233954" stroke="#3f6180"/>
  <circle cx="1040" cy="98" r="3.5" fill="#69daba"/>
  <text x="1051" y="102" font-family="monospace" font-size="10.5" fill="#a5c1db">OVERVIEW</text>
  <text x="683" y="143" font-size="17.5" font-weight="750" fill="#e8f2ff">Structured financial workflow</text>
  <text x="1127" y="143" text-anchor="end" font-family="monospace" font-size="11.5" fill="#819dbb">CONCEPT VIEW</text>
  <path d="M683 159H1126" stroke="#344b67" stroke-width="1"/>
  
  <!-- Three well-aligned activity modules -->
  <rect x="683" y="175" width="135" height="76" rx="12" fill="#172e45" stroke="#3b6280"/>
  <rect x="837" y="175" width="135" height="76" rx="12" fill="#182a46" stroke="#496187"/>
  <rect x="991" y="175" width="135" height="76" rx="12" fill="#252640" stroke="#61598e"/>
  <circle cx="703" cy="194" r="5.4" fill="#67dce7" opacity=".9"/>
  <path d="M701 194H705M703 192V196" stroke="#17374a" stroke-width="1.1"/>
  <path d="M857 190V200M857 190L864 194M857 200L864 196" stroke="#7fbcf5" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <path d="M1011 201V189M1019 201V194M1027 201V186" stroke="#b7a1fc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <text x="698" y="233" font-size="16" fill="#f0f7ff" font-weight="700">Accounts</text>
  <text x="852" y="233" font-size="16" fill="#f0f7ff" font-weight="700">Transactions</text>
  <text x="1006" y="233" font-size="16" fill="#f0f7ff" font-weight="700">Reports</text>

  <!-- Animated linking rail, movement represents data becoming useful records -->
  <path d="M707 280H1100" stroke="#436782" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M707 280H1100" stroke="url(#edge)" stroke-width="2" stroke-dasharray="4 18" stroke-linecap="round" fill="none" opacity=".72">
   <animate attributeName="stroke-dashoffset" values="0;-88" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle cx="707" cy="280" r="4.2" fill="#67dded"/>
  <circle cx="908" cy="280" r="4.2" fill="#84baff"/>
  <circle cx="1100" cy="280" r="4.2" fill="#b7a2fc"/>
  <circle r="5" fill="#91ddf5" stroke="#daf7ff" stroke-width=".7">
   <animateMotion path="M707 280H1100" dur="6.6s" repeatCount="indefinite"/>
  </circle>
 </g>
 <rect x=".5" y=".5" width="1199" height="355" rx="20.5" fill="none" stroke="#40587a" stroke-opacity=".72"/>
</g>
</svg>