<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" role="img" aria-labelledby="title desc">
<title id="title">How I approach building — a continuous development cycle</title>
<desc id="desc">Unified premium type system: restrained editorial headers, high contrast copy, and native GitHub UI borders. Flat GitHub canvas with no photo-frame background or ambient haze, optimized for light contrast. Ambient-edge integrated GitHub design, coherent cyan-violet identity. Light GitHub theme with transparent outer background. Five connected stages: understand the problem, design the data, build the logic, test and debug, and improve. An animated light follows the workflow then returns along a feedback line to represent continuous learning and iteration.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F8FA"/><stop offset=".55" stop-color="#F6F8FA"/><stop offset="1" stop-color="#F6F8FA"/></linearGradient>
 <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#238EAD"/><stop offset=".54" stop-color="#238EAD"/><stop offset="1" stop-color="#8976CF"/></linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#238EAD" stop-opacity=".22"/><stop offset="1" stop-color="#238EAD" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#D0D7DE" stroke-width=".55" opacity=".055"/></pattern>
 <clipPath id="clip"><rect width="1200" height="386" rx="21"/></clipPath>
</defs>
