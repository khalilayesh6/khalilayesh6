<text x="35" y="94" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="800" fill="#f0f6ff">Building in public.</text>
<text x="36" y="128" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#aec5df">A snapshot of my GitHub journey.</text>
