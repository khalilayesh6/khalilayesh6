<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="title description">
<title id="title">GitHub activity — Khalil Ayesh</title>
<desc id="description">Dark technical section header with gentle animated blue and violet line accents. Graph below displays actual GitHub activity.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#091526"/><stop offset=".63" stop-color="#101c35"/><stop offset="1" stop-color="#161736"/></linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48daed"/><stop offset=".52" stop-color="#557ef0"/><stop offset="1" stop-color="#a58dfa"/></linearGradient>
<pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#6f8db4" stroke-opacity=".10" stroke-width=".8"/></pattern>
<clipPath id="clip"><rect width="1200" height="156" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="156" fill="url(#bg)"/>
<rect width="1200" height="156" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="156" fill="url(#stroke)"/>
