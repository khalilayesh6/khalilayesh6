<svg xmlns="http://www.w3.org/2000/svg" width="920" height="175" viewBox="0 0 920 175" role="img" aria-labelledby="t d">
<title id="t">GitHub activity</title><desc id="d">Blue and purple animated public activity section heading.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081727"/><stop offset="1" stop-color="#161932"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4ee0ec"/><stop offset="1" stop-color="#a58cf7"/></linearGradient><pattern id="p" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M31 0H0V31" stroke="#82ade1" stroke-opacity=".1" fill="none"/></pattern></defs>
<rect width="920" height="175" rx="17" fill="url(#bg)"/><rect width="920" height="175" rx="17" fill="url(#p)"/>
<rect width="5" height="175" rx="2.5" fill="url(#bar)"/>
<text x="28" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#69dcf0">04 / PUBLIC GITHUB ACTIVITY</text>
<text x="28" y="107" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800" fill="#f1f7ff">Learning in public.</text>
<text x="30" y="145" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#aec5dc">The progress behind every commit.</text>
<g fill="none" stroke-linejoin="round"><path d="M601 117 642 92 686 108 731 62 776 89 821 43 875 60" stroke="#64ddf2" stroke-width="2.5" stroke-dasharray="7 9" opacity=".88"><animate attributeName="stroke-dashoffset" from="0" to="-150" dur="10s" repeatCount="indefinite"/></path><path d="M601 137 642 112 686 128 731 82 776 109 821 63 875 80" stroke="#aa91f5" stroke-opacity=".30" stroke-width="3"/></g>
<circle cx="731" cy="62" r="5.5" fill="#5cdeed"><animate attributeName="r" values="4;7;4" dur="3.7s" repeatCount="indefinite"/></circle>
<circle cx="821" cy="43" r="5.5" fill="#ae95fc"><animate attributeName="opacity" values=".35;1;.35" dur="3.8s" repeatCount="indefinite"/></circle>
<rect x=".5" y=".5" width="919" height="174" rx="16.5" stroke="#405b7c" stroke-opacity=".7" fill="none"/>
</svg>