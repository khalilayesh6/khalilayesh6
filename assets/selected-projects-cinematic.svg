<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="919" viewBox="0 0 1200 919" role="img" aria-labelledby="title desc">
<title id="title">Systems in Motion — Selected Projects</title>
<desc id="desc">A premium portfolio showcase for Mizan Finance and Smart University Library. Two animated miniature stories show a finance transaction saved and reflected in a report and account balance, and a physical book going from catalog to student then returning while circulation records update. Illustrative workflows, not live software or real user data.</desc>

