  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58DDEB"/><stop offset=".53" stop-color="#5B8DDE"/><stop offset="1" stop-color="#AE9BF8"/>
