<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="about-title about-desc">
  <title id="about-title">About Me — Backend-focused Developer</title>
  <desc id="about-desc">Typography V4: Segoe UI editorial hierarchy and restrained Github-aligned color system. GitHub-native flat canvas: no image-wide background, no atmospheric overlays, light contrast. Ambient-edge integrated GitHub design, coherent cyan-violet identity. Light GitHub theme with transparent outer background. I enjoy building practical projects and exploring the logic behind APIs, databases and backend systems. A navy developer-themed banner with a code panel.</desc>
