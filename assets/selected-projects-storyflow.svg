<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="groupTitle groupDesc">
<title id="groupTitle">Selected Projects — Mizan Finance and Smart University Library</title>
<desc id="groupDesc">A unified portfolio showcase containing two independent case-study cards. The first presents Mizan Finance with accounts, transactions and reporting. The second presents Smart University Library with Java, JavaFX and Maven, covering catalog records, borrowing, returns and fines. Both repositories remain private. Stage highlights and moving data markers trace the specific workflow of each project, pausing at each step. Borrowing and returning also uses a reverse signal.</desc>
<defs>
